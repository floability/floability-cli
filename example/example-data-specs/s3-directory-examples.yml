# S3 Directory Download Examples
# Example data specs demonstrating S3 directory downloads

# Example 1: Explicit source_object_type = "directory"
- name: dv5_data_explicit
  target_location: data/dv5
  source: s3://floability/dv5-sample-data/
  source_type: s3
  source_object_type: directory
  description: "Download DV5 sample data with explicit directory type"

# Example 2: Auto-detect via trailing slash
- name: dv5_data_trailing_slash
  target_location: data/dv5-auto
  source: s3://floability/dv5-sample-data/
  source_type: s3
  description: "Auto-detect directory via trailing slash"

# Example 3: Single file (for comparison)
- name: single_file
  target_location: data/single/file.root
  source: s3://floability/dv5-sample-data/some-file.root
  source_type: s3
  source_object_type: file
  description: "Download a single file from S3"

# Example 4: Nested directory
- name: nested_dir
  target_location: data/nested/samples
  source: s3://mybucket/path/to/samples/
  source_type: s3
  source_object_type: directory
  description: "Download nested directory structure"

# Example 5: Mixed files and directories in same spec
- name: mixed_example
  target_location: data/mixed
  sources:
    - source: s3://floability/dv5-sample-data/
      source_type: s3
      source_object_type: directory
    - source: s3://otherbucket/file.txt
      source_type: s3
      source_object_type: file
  description: "Mix of directory and file sources"
