schema_version: 1.0
default_profile: test

profiles:
  test:
    policy:
      retry_attempts: 3
      timeout: 60 # seconds
      size_tolerance_bytes: 1024 # bytes
    data:
      - name: book1
        source_type: http # Options: http, fs, pelican, multi, s3 if not provided, try to infer from source
        source: https://www.gutenberg.org/cache/epub/2600/pg2600.txt
        expected_size: 3359652
        content_type: text/plain
        target_path: books/war_and_peace.txt
        checksum: sha256:d4d61133bac3ddd87280783dcbd52aee85043961ea186ee422de58fffd22a00f # used if mode is 'verify'
        post_process: #applies after fetch or verify
          - operation: zip
            remove_original: false
            target_path: books/war_and_peace.zip # optional, defaults to original path with .zip extension
      - name: book2
        source_type: multi # default if source is empty and sources is provided
        sources:
          - source_type: fs
            source: books/pg1342.txt
          - source_type: http
            source: https://www.gutenberg.org/cache/epub/1342/pg1342.txt # try second source if first fails
        expected_size: 772420
        content_type: text/plain
        target_path: books/pride_and_prejudice.txt
        post_process:
          - operation: zip
            remove_original: true

  production:
    policy:
      retry_attempts: 5
      timeout: 60 # seconds
      size_tolerance_bytes: 1024 # bytes
    data:
      - name: book1
        source_type: http
        source: https://www.gutenberg.org/cache/epub/2600/pg2600.txt
        expected_size: 3359652
        content_type: text/plain
        checksum: sha256:d4d61133bac3ddd87280783dcbd52aee85043961ea186ee422de58fffd22a00f # used if mode is 'verify'
        target_path: books/war_and_peace.txt
        post_process:
          - operation: zip
            remove_original: false
      - name: book2
        source_type: multi
        sources:
          - source_type: fs
            source: books/pg1342.txt
          - source_type: http
            source: https://www.gutenberg.org/cache/epub/1342/pg1342.txt # try second source if first fails
        expected_size: 772429
        content_type: text/plain
        target_path: books/pride_and_prejudice.txt
        post_process:
          - operation: zip
            remove_original: true