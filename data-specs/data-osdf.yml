schema_version: 1.0
default_profile: test

profiles:
  test:
    policy:
      default_mode: check            # Options: check, fetch, verify
      retry_attempts: 3
      timeout: 60                    # seconds
      size_tolerance_bytes: 1024     # bytes
    data:
      - name: ghcnd-stations
        source_type: pelican
        source: osdf:///aws-opendata/us-east-1/noaa-ghcn-pds/ghcnd-stations.txt
        content_type: text/plain
        expected_size: 11150588
        target_path: data/ghcnd/ghcnd-stations.txt
        post_process:               # applies after fetch or verify
          - operation: zip
            remove_original: false
            target_path: data/ghcnd/ghcnd-stations.zip

      - name: ghcnd-station-csv
        source_type: pelican
        source: osdf:///aws-opendata/us-east-1/noaa-ghcn-pds/csv/by_station/USW00014837.csv
        content_type: text/csv
        expected_size: 14661925
        target_path: data/ghcnd/USW00014837.csv
        post_process:
          - operation: gzip
            remove_original: true
            # target_path optional; if omitted, defaults to adding .gz

  production:
    policy:
      default_mode: verify           # Options: check, fetch, verify
      retry_attempts: 5
      timeout: 60                    # seconds
      size_tolerance_bytes: 1024     # bytes
    data:
      - name: ghcnd-stations
        source_type: pelican
        source: osdf:///aws-opendata/us-east-1/noaa-ghcn-pds/ghcnd-stations.txt
        content_type: text/plain
        target_path: data/ghcnd/ghcnd-stations.txt
        post_process:
          - operation: zip
            remove_original: false

      - name: ghcnd-station-csv
        source_type: pelican
        source: osdf:///aws-opendata/us-east-1/noaa-ghcn-pds/csv/by_station/USW00014837.csv
        content_type: text/csv
        target_path: data/ghcnd/USW00014837.csv
        post_process:
          - operation: gzip
            remove_original: true
