schema_version: 1.0
default_profile: test

profiles:
  test:
    policy:
      retry_attempts: 0         # local filesystem usually doesn't need retries
      timeout: 30               # kept for interface parity (not used for fs)
      size_tolerance_bytes: 0   # exact match expected for local files
    data:
      - name: local_readme
        source_type: fs         # Explicitly a filesystem source
        source: README.md       # Relative to backpack (or current working) root
        expected_size: null     # Fill in after first check if you want size validation
        content_type: text/plain
        target_path: data/readme_copy.md  # Where it would be placed after fetch/verify
        checksum: null          # Optional: e.g., sha256:<hex>; used only in verify mode
        post_process: []        # No post-processing for this simple example
