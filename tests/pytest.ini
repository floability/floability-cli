[pytest]
# Pytest configuration for Floability tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Fast unit tests without network dependencies
    network: Tests requiring network access
    slow: Long-running tests
    integration: Full system integration tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Test timeout (prevent hanging tests)
timeout = 300

# Coverage options (when using --cov)
[coverage:run]
source = floability

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
